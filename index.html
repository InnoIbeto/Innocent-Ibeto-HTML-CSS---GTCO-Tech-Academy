<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <!-- SECTION 1: NAV BAR -->

    <header class="navbar-wrapper">
          <nav class="navbar">

               <a href="#" class="nav-logo">
                    <img src="Image/posh-logo.png" alt="Posh Logo" class="logo-img">
               </a>
               
               <ul class="nav-links">
                    <li><a href="#" class="nav-item active">Home</a></li>
                    <li><a href="#" class="nav-item">Pages</a></li>
                    <li><a href="#" class="nav-item">Components</a></li>
                    <li><a href="#" class="nav-item">Docs</a></li>
               </ul>
          </nav>
    </header>

     <!-- SECTION 2: HERO -->

     <section class="hero-section">
        <div class="hero-container">
            <span class="hero-badge">Introducing POSH</span>
            <h1 class="hero-title">Capture <span class="accent-text">gorgeous</span> moments</h1>
            <p class="hero-subtitle">Any moment that matters, we make it last forever!</p>
            
            <div class="hero-actions">
                <a href="#" class="btn-gallery">Explore gallery</a>
                <div class="hero-subtext-action">
                    <span class="actions-divider">or</span>
                    <a href="#" class="btn-Purchase">Purchase POSH →</a>
                </div>
            </div>

            <div class="hero-showcase">
                <img src="Image/hero-image.jpg" alt="Posh Interface Preview" class="hero-image">
            </div>
        </div>
     </section>
    
</body>
</html>
